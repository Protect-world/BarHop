version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: barhop-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: barhop_root
      MYSQL_DATABASE: barhop
      MYSQL_USER: barhop_user
      MYSQL_PASSWORD: barhop_pass
      TZ: Asia/Shanghai
      MYSQL_INITDB_SKIP_TZINFO: 1
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-character-set-client-handshake

  redis:
    image: redis:7-alpine
    container_name: barhop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  mysql_data:
  redis_data: